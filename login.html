<!DOCTYPE html>
<html lang="es">
<head>
    <title>Pokes login</title>
    <link rel="stylesheet" type="text/css" href="Mascota.css/styleGeneral.css">
</head>
<body>
    <header> 
        <img src="img/logo.png">
        <h1>POKES Contable</h1>
    </header>
    <section class="form-main">
        <div class="form-content">
            <div class="box">
                <h3>Inicio sesión</h3>
                <form action="">
                    <div class="input-box">
                        <input type="text" placeholder="Email" class="input-control">
                    </div>
                    <div class="input-box">
                        <input type="password" placeholder="Contraseña" class="input-control">
                        <div class="input-link">
                            <a href="#" class="gradient-text">Has olvidado tu contraseña</a>
                        </div>
                    </div>
                    <button type="submit" class="btn" onclick="location.href='inicio.html'">Iniciar</button>
                </form>
                <p>No tienes una cuenta? <a href="inicio.html" target="_blank">click aqui</a></p>
            </div>
        </div>
    </section>
    <footer>
        <p> Visita www.pokespatitaslimpias.com.co </p>
    </footer>
</body>
</html>
